[package]
edition = "2021"
name    = "shuvi-swc"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin = ["swc/plugin"]

[dependencies]
chrono = "0.4"
easy-error = "1.0.0"
either = "1"
fxhash = "0.2.1"
modularize_imports = { path = "../modularize_imports" }
once_cell = "1.13.0"
pathdiff = "0.2.0"
regex = "1.5"
serde = "1"
serde_json = "1"
styled_components = { path = "../styled_components" }
swc = { version = "0.265.7", default-features = false }
swc_atoms = "0.5.9"
swc_cached = "0.3.17"
swc_common = { version = "0.32.0", features = ["concurrent", "sourcemap"] }
swc_ecma_loader = { version = "0.44.2", features = ["node", "lru"] }
swc_ecmascript = { version = "0.233.7", features = [
  "codegen",
  "minifier",
  "optimization",
  "parser",
  "react",
  "transforms",
  "typescript",
  "utils",
  "visit",
] }
swc_emotion = { path = "../emotion" }
swc_plugin_runner = { version = "0.64.0", optional = true, default-features = false }
tracing = { version = "0.1.32", features = ["release_max_level_info"] }
wasmer = { version = "2.3.0", optional = true, default-features = false }
wasmer-wasi = { version = "2.3.0", optional = true, default-features = false }

[dev-dependencies]
swc_ecma_transforms_testing = "0.135.2"
testing                     = "0.34.0"
walkdir                     = "2.3.2"
