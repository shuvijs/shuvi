[package]
authors     = ["강동윤 <kdy1997.dev@gmail.com>"]
description = "AST Transforms for emotion"
edition     = "2021"
license     = "Apache-2.0"
name        = "swc_emotion"
repository  = "https://github.com/vercel/shuvi.js.git"
version     = "0.12.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.13"
byteorder = "1"
fxhash = "0.2.1"
once_cell = "1.13.0"
radix_fmt = "1"
regex = "1.5"
serde = "1"
sourcemap = "6.0.1"
swc_atoms = "0.5.9"
swc_common = { version = "0.32.0", features = ["concurrent", "sourcemap"] }
swc_ecmascript = { version = "0.233.7", features = [
  "codegen",
  "utils",
  "visit",
] }
swc_trace_macro = "0.1.3"
tracing = { version = "0.1.32", features = ["release_max_level_info"] }

[dev-dependencies]
swc_ecma_transforms_testing = "0.135.2"
testing                     = "0.34.0"
