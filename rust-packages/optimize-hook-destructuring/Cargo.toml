[package]

description = "SWC plugin that optimizes React hook destructuring patterns"

authors      = { workspace = true }
edition      = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
name         = "swc_plugin_optimize_hook_destructuring"
publish      = false
repository   = { workspace = true }
rust-version = { workspace = true }
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
optimize_hook_destructuring_transform = { path = "./transform" }
serde_json                            = { workspace = true }
swc_common                            = { workspace = true, features = ["concurrent"] }
swc_core                              = { workspace = true, features = ["ecma_plugin_transform"] }
swc_ecma_ast                          = { workspace = true }
swc_ecma_utils                        = { workspace = true }
swc_ecma_visit                        = { workspace = true }
swc_plugin_macro                      = { workspace = true }
tracing                               = { workspace = true, features = ["release_max_level_off"] }
