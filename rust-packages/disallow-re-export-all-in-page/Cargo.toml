[package]

description = "SWC plugin that disallows `export * from ...` in page files"

authors      = { workspace = true }
edition      = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
name         = "swc_plugin_disallow_re_export_all_in_page"
repository   = { workspace = true }
rust-version = { workspace = true }
version      = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
disallow_re_export_all_in_page_transform = { path = "./transform" }
serde                                    = { workspace = true, features = ["derive"] }
serde_json                               = { workspace = true }
swc_common                               = { workspace = true, features = ["concurrent"] }
swc_core                                 = { workspace = true, features = ["ecma_plugin_transform"] }
swc_ecma_ast                             = { workspace = true }
swc_ecma_utils                           = { workspace = true }
swc_ecma_visit                           = { workspace = true }
swc_plugin_macro                         = { workspace = true }
tracing                                  = { workspace = true, features = ["release_max_level_off"] }
